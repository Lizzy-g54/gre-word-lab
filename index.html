<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ed">
  <meta name="description" content="GRE 1400 词中文释义、六选二等价词与每日错词复习。">
  <title>GRE 词汇练习室</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="GRE 词汇练习室首页"><span class="brand-mark">G<span>·</span></span><span>GRE<br><small>词汇练习室</small></span></a>
      <div class="side-label">练习空间</div>
      <nav class="nav" aria-label="主导航">
        <button data-page="home" class="active"><span class="nav-icon">⌂</span> 总览</button>
        <button data-page="meaning"><span class="nav-icon">文</span> 认中文</button>
        <button data-page="pairs"><span class="nav-icon">∞</span> 等价词</button>
        <button data-page="review"><span class="nav-icon">↺</span> 每日错词</button>
        <button data-page="library"><span class="nav-icon">▤</span> 我的词库</button>
      </nav>
      <div class="side-bottom"><div class="side-date" id="sideDate"></div><p>每天一点，记得更牢。</p></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="breadcrumb">GRE 词汇练习室 <span>/</span> <strong id="pageTitle">总览</strong></div><div class="top-right"><span class="save-dot"></span> 进度已存于此浏览器</div></header>
      <div id="view" class="view"></div>
    </main>
  </div>
  <input id="importFile" type="file" accept=".csv,.tsv,text/csv,text/tab-separated-values" hidden>
  <input id="progressFile" type="file" accept=".json,application/json" hidden>
  <script src="./app.js" defer></script>
</body>
</html>
